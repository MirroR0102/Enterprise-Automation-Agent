<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运营工作台 · Ops Agent</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">Enterprise <span>Ops Agent</span></div>
      <div>
        <span class="badge" id="who"></span>
        <a href="/logs.html" id="logsLink" hidden>日志</a>
        <button class="ghost" id="logout">退出</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <textarea id="prompt">帮我搜索2026AI行业新闻，再查询本月销售总额，计算同比增长率，生成一份运营周报markdown</textarea>
      <div class="row">
        <button class="primary" id="send">发送任务</button>
        <button id="cancel">取消</button>
        <span class="hint" id="status">就绪</span>
      </div>
    </div>
    <div class="grid">
      <section class="card">
        <h3>执行过程</h3>
        <div class="timeline" id="timeline"></div>
      </section>
      <section class="card">
        <h3>最终 Markdown</h3>
        <div class="md-body" id="report"><p class="hint">完成后会渲染在这里。</p></div>
      </section>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    requireLogin();
    document.getElementById("who").textContent = getRole();
    if (getRole() === "dev") document.getElementById("logsLink").hidden = false;
    document.getElementById("logout").onclick = () => { clearSession(); location.href = "/login.html"; };

    let sessionId = "";
    let pollTimer = null;

    async function ensureSession() {
      if (sessionId) return sessionId;
      const res = await api("/api/sessions", { method: "POST" });
      const body = await res.json();
      sessionId = body.session_id;
      return sessionId;
    }

    function renderEvents(events) {
      const box = document.getElementById("timeline");
      box.innerHTML = "";
      let finalMd = "";
      for (const ev of events || []) {
        const div = document.createElement("div");
        div.className = "event " + (ev.type || "");
        const tool = ev.tool ? ` · ${ev.tool}` : "";
        div.innerHTML = `<div class="meta">${ev.timestamp || ""} · ${ev.type}${tool}</div><div>${ev.content || ""}</div>`;
        if (ev.input) {
          const pre = document.createElement("pre");
          pre.textContent = "入参: " + ev.input;
          div.appendChild(pre);
        }
        if (ev.output) {
          const pre = document.createElement("pre");
          pre.textContent = "返回: " + ev.output;
          div.appendChild(pre);
        }
        box.appendChild(div);
        if (ev.type === "final") finalMd = ev.content || "";
      }
      if (finalMd && window.marked) {
        document.getElementById("report").innerHTML = marked.parse(finalMd);
      }
      box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      if (!sessionId) return;
      const res = await api(`/api/sessions/${sessionId}/events`);
      const body = await res.json();
      document.getElementById("status").textContent = body.status || "";
      renderEvents(body.events);
      const done = ["completed", "failed", "cancelled", "timeout", "max_rounds"];
      if (done.includes(body.status)) {
        clearInterval(pollTimer);
        pollTimer = null;
        document.getElementById("send").disabled = false;
      }
    }

    document.getElementById("send").onclick = async () => {
      const content = document.getElementById("prompt").value.trim();
      if (!content) return;
      document.getElementById("send").disabled = true;
      document.getElementById("report").innerHTML = '<p class="hint">执行中…</p>';
      sessionId = "";
      await ensureSession();
      const res = await api(`/api/sessions/${sessionId}/messages`, {
        method: "POST",
        body: JSON.stringify({ content }),
      });
      if (!res.ok) {
        document.getElementById("status").textContent = "发送失败";
        document.getElementById("send").disabled = false;
        return;
      }
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 400);
      poll();
    };

    document.getElementById("cancel").onclick = async () => {
      if (!sessionId) return;
      await api(`/api/sessions/${sessionId}/cancel`, { method: "POST" });
      poll();
    };
  </script>
</body>
</html>
