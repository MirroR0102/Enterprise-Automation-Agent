<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开发日志 · 运营业务自动化 Agent</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <!-- 开发日志页：无侧栏的简易 shell -->
  <div class="shell">
    <div class="top">
      <div class="brand">开发日志 <span>· Dev</span></div>
      <div class="row" style="margin:0">
        <a href="/#ops">返回工作台</a>
        <button class="ghost" type="button" id="logout">退出</button>
      </div>
    </div>
    <!-- 筛选与日志列表 -->
    <div class="card">
      <p class="hint" id="msg">仅 dev 角色可查看全部工具调用日志。保留 60 天，可用 scripts/purge_logs.py 清理。</p>
      <div class="row">
        <input id="sid" placeholder="按 session_id 筛选（可空）" />
        <button class="primary" type="button" id="load">刷新</button>
      </div>
      <div class="timeline" id="list" style="margin-top:1rem;max-height:70vh"></div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    // 登录校验与退出
    requireLogin();
    document.getElementById("logout").onclick = () => { clearSession(); location.href = "/login.html"; };
    // 非 dev 角色仅提示无权，不拉取数据
    if (getRole() !== "dev") {
      document.getElementById("msg").textContent = "当前账号无权查看开发日志（需要 dev）。";
    }
    // 拉取 /api/logs，可选 session_id 筛选，渲染 JSON 事件
    async function load() {
      const sid = document.getElementById("sid").value.trim();
      const qs = sid ? `?session_id=${encodeURIComponent(sid)}` : "";
      const res = await api("/api/logs" + qs);
      const list = document.getElementById("list");
      if (res.status === 403) {
        list.innerHTML = "<p class='error'>权限不足</p>";
        return;
      }
      const body = await res.json();
      list.innerHTML = "";
      for (const ev of body.items || []) {
        const div = document.createElement("div");
        div.className = "event " + (ev.type || "");
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `${ev.timestamp || ""} · ${ev.type || ev.event_type || ""}`;
        if (ev.session_id) meta.innerHTML += ` · <span class="pill">${ev.session_id.slice(0, 8)}…</span>`;
        if (ev.tool) meta.innerHTML += ` · <span class="pill">${ev.tool}</span>`;
        div.appendChild(meta);
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(ev, null, 2);
        div.appendChild(pre);
        list.appendChild(div);
      }
    }
    document.getElementById("load").onclick = load;
    if (getRole() === "dev") load();
  </script>
</body>
</html>
