<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 运营业务自动化 Agent</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <!-- 登录页：居中卡片表单 -->
  <div class="login-wrap">
    <form class="login-card" id="form">
      <h1>运营业务自动化 Agent</h1>
      <p class="sub">Enterprise Ops Agent · 第 4 部分工作台</p>
      <p class="hint">演示账号：ops / ops123（运营），dev / dev123（开发）</p>
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p class="error" id="err"></p>
      <button class="primary" type="submit" style="width:100%;margin-top:0.85rem">登录</button>
    </form>
  </div>
  <script src="/common.js"></script>
  <script>
    // 已登录则直接进入工作台
    if (getToken()) location.href = "/#ops";
    // 提交表单：调用 /api/auth/login，成功后写入会话并跳转
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const err = document.getElementById("err");
      err.textContent = "";
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = body.detail || "登录失败";
        return;
      }
      setSession(body.access_token, body.role, data.username);
      location.href = "/#ops";
    });
  </script>
</body>
</html>
