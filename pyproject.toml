[project]
name = "enterprise-ops-agent"
version = "0.1.0"
description = "Enterprise operations automation agent (LangGraph + FastAPI)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# 分析器用项目 .venv（勿用 Anaconda 全局解释器，否则报找不到 tavily 等依赖）
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["."]
